[project]
name = "ansi-scaler"
description = "Build reproducible synthetic ANSI-art training corpora"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.9",
    "cairosvg>=2.8",
    "diffusers>=0.35",
    "numba>=0.61",
    "pillow>=12.0",
    "protobuf>=6.31",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "rembg[cpu]>=2.0.69",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "torch>=2.7",
    "transformers>=4.53",
    "typer>=0.16",
    "vtracer>=0.6.11",
]

[project.scripts]
ansi-scaler = "ansi_scaler.cli:app"

[dependency-groups]
dev = [
    "coverage>=7.10",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core>=3.12,<4"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

