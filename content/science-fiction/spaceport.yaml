theme: science-fiction
location: spaceport
objects:
  - {id: service-robot, label: Service robot, subject_family: service-robot, prompt: "single compact friendly service robot on two sturdy legs, full body three-quarter view, simple tool compartments and cyan status lights", exclusions: [hangar, machinery, additional robots], tags: [character, robot]}
  - {id: shuttle-pilot, label: Shuttle pilot, subject_family: pilot, prompt: "single confident spacecraft pilot standing full body in a practical flight suit and compact helmet carried under one arm", exclusions: [spacecraft, cockpit, additional people], tags: [character]}
  - {id: maintenance-drone, label: Maintenance drone, subject_family: maintenance-drone, prompt: "single small hovering maintenance drone with three articulated tool arms and a central blue sensor, three-quarter view", exclusions: [hangar, additional drones, machinery], tags: [robot]}
  - {id: passenger-shuttle, label: Passenger shuttle, subject_family: shuttle, prompt: "single small passenger space shuttle with a broad fuselage, cockpit windows, short wings and landing gear, complete side three-quarter view", exclusions: [rocket, launch pad, stars, planet, additional spacecraft], tags: [vehicle]}
  - {id: cargo-tug, label: Cargo tug, subject_family: cargo-tug, prompt: "single compact low-profile spaceport cargo tug with four chunky wheels and an empty rear coupling, side three-quarter view", exclusions: [cargo, driver, hangar, additional vehicles], tags: [vehicle]}
  - {id: cargo-container, label: Cargo container, subject_family: cargo-container, prompt: "single rugged science-fiction cargo container with reinforced corners, recessed handles and small cyan status panel, three-quarter view", exclusions: [text, logos, stacked containers, hangar], tags: [container]}
  - {id: maintenance-toolbox, label: Maintenance toolbox, subject_family: toolbox, prompt: "single closed futuristic maintenance toolbox with reinforced shell, top handle and two metal latches, three-quarter view", exclusions: [tools outside box, workshop], tags: [tool]}
  - {id: warning-beacon, label: Warning beacon, subject_family: warning-beacon, prompt: "single freestanding industrial warning beacon on a short weighted post with one glowing amber light, full object visible", exclusions: [runway, additional lights, machinery], tags: [fixture]}
  - {id: fuel-pump, label: Fuel pump, subject_family: fuel-pump, prompt: "single compact spacecraft fuel pump unit with sturdy base, simple control panel and one neatly coiled hose, three-quarter view", exclusions: [spacecraft, worker, hangar, text], tags: [fixture]}
  - {id: vending-machine, label: Vending machine, subject_family: vending-machine, prompt: "single futuristic vending machine with colourful product windows, rounded metal housing and a blank control display, front three-quarter view", exclusions: [text, logos, people, room], tags: [fixture]}
